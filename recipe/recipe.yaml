context:
  version: "1.4.4"
  # the nightly bun pins in rust-toolchain.toml, as packaged on
  # conda-forge/label/rust_dev. Later nightlies (from 2026-09-24) drop the
  # allocator_api feature bun's crates enable, and stable 1.99 lacks
  # core::mem::type_info::of, so only this one builds bun.
  rust_nightly: "1.100.0.dev20260915"

package:
  name: bun
  version: ${{ version }}

source:
  - url: https://github.com/oven-sh/bun/archive/refs/tags/bun-v${{ version }}.tar.gz
    sha256: 00ce37fa5ac393a7d225bcf847365982fceb818b56a19b6884fefd67918468ff
    patches:
      - 0001-Disable-Werror.patch
      - 0002-Don-t-statically-link-libstdc-and-libgcc.patch
      - 0003-Disable-ld_new.patch
      - 0004-Support-cross-compiling-with-conda-forge-s-compilers.patch
      - 0005-Use-the-macOS-SDK-from-the-conda-build-environment.patch
      - 0006-Allow-linking-selected-dependencies-from-the-system.patch
      - 0007-Set-the-build-revision-to-a-placeholder.patch
  - if: build_platform == "osx-64"
    then:
      url: https://github.com/oven-sh/bun/releases/download/bun-v${{ version }}/bun-darwin-x64.zip
      sha256: 50a3491f73abc2fe81673171a85762d3bc2cc1680ccecadd983de99adf77977e
      target_directory: bun.native
  - if: build_platform == "osx-arm64"
    then:
      url: https://github.com/oven-sh/bun/releases/download/bun-v${{ version }}/bun-darwin-aarch64.zip
      sha256: c240d7f0ccb90c263a849fcdb09b7ee62630d921348ed6aafda86b9d577bc510
      target_directory: bun.native
  - if: build_platform == "linux-aarch64"
    then:
      url: https://github.com/oven-sh/bun/releases/download/bun-v${{ version }}/bun-linux-aarch64.zip
      sha256: baa6bb36f51d6e58561e02bbea825038a9df454f673d6d776e8bbf86f8c7850e
      target_directory: bun.native
  - if: build_platform == "linux-64"
    then:
      url: https://github.com/oven-sh/bun/releases/download/bun-v${{ version }}/bun-linux-x64-baseline.zip
      sha256: e0446eb55995772eb9894bebae9a6be368d985a8b9271ee124486f9946eedd76
      target_directory: bun.native
  - if: build_platform == "win-64"
    then:
      url: https://github.com/oven-sh/bun/releases/download/bun-v${{ version }}/bun-windows-x64.zip
      sha256: cd2c0fccc78f3ede1f50ca827a15f063eda13d4d150a3d0674f4f6e323d864a5
      target_directory: bun.native
  # simdutf is statically linked via the prebuilt WebKit, which doesn't ship its license
  - url: https://raw.githubusercontent.com/simdutf/simdutf/refs/heads/master/LICENSE-MIT
    sha256: fc8dbc04e03ad4efc08a647ffe7f995b811a95bc04c0e85a56d5277c6593fa5f
    file_name: simdutf-LICENSE-MIT
  - url: https://raw.githubusercontent.com/simdutf/simdutf/refs/heads/master/LICENSE-APACHE
    sha256: 3d34610fc6b5e1b0bfe4e2f36171c2d62c28ef05cb8d704f5a0073be41a43b3d
    file_name: simdutf-LICENSE-APACHE

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    # Not ${{ compiler('rust') }}: rust_dev has no activation package for this
    # nightly, and bun's build drives rustc and cargo itself (target, linker and
    # CC/CXX for build scripts are set in scripts/build/rust.ts), so the
    # activation's environment isn't needed.
    - rust ${{ rust_nightly }}.*
    - if: target_platform == "linux-aarch64"
      then:
        # cross-compiled on linux-64
        - rust-std-aarch64-unknown-linux-gnu ${{ rust_nightly }}.*
    # bun's link takes every Rust crate's rlib, std's included, so std is
    # always built from source with -Zbuild-std, which needs its sources at
    # $BUN_TOOLCHAIN_RUST/lib/rustlib/src/rust
    - rust-src ${{ rust_nightly }}.*
    - ${{ stdlib('c') }}
    - if: linux
      then:
        # ensure libstdcxx-devel version matches libgcc-devel so that
        # clang can find the C++ standard library headers
        - libstdcxx-devel_linux-64 >=15
    - cargo-bundle-licenses
    - cmake
    - git
    - if: unix
      then:
        - lld ${{ c_compiler_version }}.*
        - llvm-tools ${{ c_compiler_version }}.*
        - sed
    - if: win
      then:
        # clang-cl, lld-link, llvm-lib and llvm-rc; the MSVC headers and
        # libraries come from the vs2022 compiler activation. Same LLVM
        # major as rustc's, see conda_build_config.yaml
        - clang 23.*
        - lld 23.*
        - llvm-tools 23.*
    - if: x86_64
      then:
        # x64 assembly of the vendored libjpeg-turbo and, on Windows, BoringSSL
        - nasm
    - ninja
    - perl
    - pkgconf
  host:
    # unpatched upstream dependencies, used instead of the vendored copies
    # (see BUN_SYSTEM_DEPS in build.sh and build.bat)
    # headers of libbrotli{common,dec,enc}
    - brotli
    - hdrhistogram-c
    - libdeflate
    - libhwy
    - libwebp-base
    # ls-hpack stays vendored: bun needs it built with
    # LSXPACK_MAX_STRLEN=UINT32_MAX, which changes the ABI of
    # struct lsxpack_header (see build.sh)
    # libjpeg-turbo stays vendored: bun needs its own patch to it, which adds
    # tj3BunCompletedWithWarning() (see build.sh)
    - zlib
    - zstd
    - if: not osx
      then:
        # on macOS, bun loads the system's libsqlite3 at runtime
        - libsqlite
  run_exports:
    # `bun build --compile` copies the bun executable into its output, so the
    # compiled program links the same shared libraries as bun. Packages that
    # put bun into host get them as run dependencies, with the same bounds as
    # bun's own run dependencies, which come from the run_exports of the
    # requirements above. No compiler or stdlib is needed to compile with bun,
    # so the C/C++ runtime and system requirements are exported as well.
    # Keep this in sync with the build and host requirements;
    # check_run_exports.py in the tests fails if the packages differ.
    weak:
      - if: linux
        then:
          - __glibc >=${{ c_stdlib_version }},<3.0.a0
          - ${{ pin_compatible('libgcc', lower_bound='x', upper_bound=None) }}
          - ${{ pin_compatible('libstdcxx', lower_bound='x', upper_bound=None) }}
      - if: osx
        then:
          - __osx >=${{ c_stdlib_version }}
          - libcxx >=${{ cxx_compiler_version }}
      - ${{ pin_compatible('hdrhistogram-c', upper_bound='x.x.x') }}
      - ${{ pin_compatible('libbrotlicommon', upper_bound='x.x') }}
      - ${{ pin_compatible('libbrotlidec', upper_bound='x.x') }}
      - ${{ pin_compatible('libbrotlienc', upper_bound='x.x') }}
      - ${{ pin_compatible('libdeflate', upper_bound='x.x') }}
      - ${{ pin_compatible('libhwy', upper_bound='x.x') }}
      - ${{ pin_compatible('libwebp-base', upper_bound='x') }}
      - ${{ pin_compatible('libzlib', upper_bound='x') }}
      - ${{ pin_compatible('zstd', upper_bound='x.x') }}
      - if: not osx
        then:
          - ${{ pin_compatible('libsqlite', upper_bound='x') }}

tests:
  - package_contents:
      bin:
        - bun
        - bunx
      files:
        - if: unix
          then:
            - share/bash-completion/completions/bun
            - share/zsh/site-functions/_bun
            - share/fish/vendor_completions.d/bun.fish
        # rattler-build packages the files of the tests below here
        - etc/conda/test-files/bun/*/compile_smoke_test.js
      strict: true
  - script:
      - bun --version
      - bun --help
      - bunx --version
      # simple smoke test
      - bunx cowsay hello
  # `bun build --compile` produces a working executable. It is a copy of bun
  # with the program embedded and finds bun's shared libraries relative to its
  # own location, so it is written next to bun, where a package that compiles
  # with bun has to install its executable too.
  - script:
      - if: unix
        then:
          - bun build --compile compile_smoke_test.js --outfile $PREFIX/bin/bun-compile-smoke-test
        else:
          - bun build --compile compile_smoke_test.js --outfile %PREFIX%\Library\bin\bun-compile-smoke-test.exe
      - bun-compile-smoke-test with arguments
    files:
      recipe:
        - compile_smoke_test.js
  # the run_exports above name the same packages as bun's run dependencies
  - script:
      file: check_run_exports.py
      interpreter: python
    requirements:
      run:
        - python

about:
  homepage: https://bun.sh
  repository: https://github.com/oven-sh/bun
  license: MIT
  license_file:
    - LICENSE.md
    - picohttp-LICENSE-MIT
    - packages/bun-usockets/LICENSE
    - packages/bun-uws/LICENSE
    - src/clap/LICENSE
    - simdutf-LICENSE-MIT
    - simdutf-LICENSE-APACHE
    # Rust crate licenses, generated by cargo-bundle-licenses in build.sh
    - THIRDPARTY.yml
    # licenses of the statically linked vendored C/C++ dependencies,
    # collected from vendor/ in build.sh
    - vendored-licenses/
  summary: Bun is a fast all-in-one JavaScript runtime

extra:
  recipe-maintainers:
    - xhochy
    - pavelzw
    - I-Al-Istannen
    - zklaus
