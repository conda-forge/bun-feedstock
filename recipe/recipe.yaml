context:
  version: "1.4.2"

package:
  name: bun
  version: ${{ version }}

source:
  - url: https://github.com/oven-sh/bun/archive/refs/tags/bun-v${{ version }}.tar.gz
    sha256: e14670b117d69012d828514d657f0a3133d1c25d13d69461184d05b6a8e9a876
    patches:
      - 0001-Disable-Werror.patch
      - 0002-Don-t-statically-link-libstdc-and-libgcc.patch
      - 0003-Disable-ld_new.patch
      - 0004-Use-prebuilt-Rust-std-for-release-builds.patch
      - 0005-Support-cross-compiling-with-conda-forge-s-compilers.patch
      - 0006-Use-the-macOS-SDK-from-the-conda-build-environment.patch
      - 0007-Allow-linking-selected-dependencies-from-the-system.patch
      - 0008-Set-the-build-revision-to-a-placeholder.patch
  - if: build_platform == "osx-64"
    then:
      url: https://github.com/oven-sh/bun/releases/download/bun-v${{ version }}/bun-darwin-x64.zip
      sha256: 80520d7e17526308c9185d261679ac6d27798d3803a0e9f7ff9121ab8affb012
      target_directory: bun.native
  - if: build_platform == "osx-arm64"
    then:
      url: https://github.com/oven-sh/bun/releases/download/bun-v${{ version }}/bun-darwin-aarch64.zip
      sha256: 90987a3a16d7db556d886ac3d551e7b6d3edf0a1cf43acaed622e8676be1d12f
      target_directory: bun.native
  - if: build_platform == "linux-aarch64"
    then:
      url: https://github.com/oven-sh/bun/releases/download/bun-v${{ version }}/bun-linux-aarch64.zip
      sha256: 54328bbc2d9c8e0c9f892c544d66c57a83b84139e34909e5ee81758f1ac8fda7
      target_directory: bun.native
  - if: build_platform == "linux-64"
    then:
      url: https://github.com/oven-sh/bun/releases/download/bun-v${{ version }}/bun-linux-x64-baseline.zip
      sha256: c678040f14fe0440eb839d37cbd0ce4c051a32da72806ac97de6a6aab6bf728f
      target_directory: bun.native
  - if: build_platform == "win-64"
    then:
      url: https://github.com/oven-sh/bun/releases/download/bun-v${{ version }}/bun-windows-x64.zip
      sha256: ce4c17497b2f29712a99d3d53f028de28cd42e3bacb8589599e7f000e49b6405
      target_directory: bun.native
  # simdutf is statically linked via the prebuilt WebKit, which doesn't ship its license
  - url: https://raw.githubusercontent.com/simdutf/simdutf/refs/heads/master/LICENSE-MIT
    sha256: fc8dbc04e03ad4efc08a647ffe7f995b811a95bc04c0e85a56d5277c6593fa5f
    file_name: simdutf-LICENSE-MIT
  - url: https://raw.githubusercontent.com/simdutf/simdutf/refs/heads/master/LICENSE-APACHE
    sha256: 3d34610fc6b5e1b0bfe4e2f36171c2d62c28ef05cb8d704f5a0073be41a43b3d
    file_name: simdutf-LICENSE-APACHE

build:
  number: 2

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    # nightly rust from conda-forge/label/rust_dev (see conda_build_config.yaml)
    - ${{ compiler('rust') }}
    - ${{ stdlib('c') }}
    - if: linux
      then:
        # ensure libstdcxx-devel version matches libgcc-devel so that
        # clang can find the C++ standard library headers
        - libstdcxx-devel_linux-64 >=15
    - cargo-bundle-licenses
    - cmake
    - git
    - if: unix
      then:
        - lld ${{ c_compiler_version }}.*
        - llvm-tools ${{ c_compiler_version }}.*
        - sed
    - if: win
      then:
        # clang-cl, lld-link, llvm-lib and llvm-rc; the MSVC headers and
        # libraries come from the vs2022 compiler activation
        - clang 21.*
        - lld 21.*
        - llvm-tools 21.*
        # BoringSSL's and libjpeg-turbo's x64 assembly
        - nasm
        # the Windows .bin/ shim is built with -Zbuild-std
        - rust-src
    - ninja
    - perl
    - pkg-config
  host:
    # unpatched upstream dependencies, used instead of the vendored copies
    # (see BUN_SYSTEM_DEPS in build.sh and build.bat)
    # headers of libbrotli{common,dec,enc}
    - brotli
    - hdrhistogram-c
    - libdeflate
    - libhwy
    - libjpeg-turbo
    - libwebp-base
    - if: unix
      then:
        # not available on Windows, vendored there
        - ls-hpack
    - zlib
    - zstd
    - if: not osx
      then:
        # on macOS, bun loads the system's libsqlite3 at runtime
        - libsqlite
  run_exports:
    # `bun build --compile` copies the bun executable into the output, so the
    # compiled binary links the same shared libraries as bun. Packages that
    # put bun into host get them as run dependencies, with the same bounds as
    # the libraries' own run_exports. No compiler or stdlib is needed for this,
    # so the C/C++ runtime and system requirements are exported as well. On
    # Windows, bun links the MSVC runtime statically.
    weak:
      - if: linux
        then:
          - __glibc >=${{ c_stdlib_version }},<3.0.a0
          - ${{ pin_compatible('libgcc', upper_bound=None) }}
          - ${{ pin_compatible('libstdcxx', upper_bound=None) }}
      - if: osx
        then:
          - __osx >=${{ c_stdlib_version }}
          - ${{ pin_compatible('libcxx', upper_bound=None) }}
      - ${{ pin_compatible('hdrhistogram-c', upper_bound='x.x.x') }}
      - ${{ pin_compatible('libbrotlicommon', upper_bound='x.x') }}
      - ${{ pin_compatible('libbrotlidec', upper_bound='x.x') }}
      - ${{ pin_compatible('libbrotlienc', upper_bound='x.x') }}
      - ${{ pin_compatible('libdeflate', upper_bound='x.x') }}
      - ${{ pin_compatible('libhwy', upper_bound='x.x') }}
      - ${{ pin_compatible('libjpeg-turbo', upper_bound='x') }}
      - ${{ pin_compatible('libwebp-base', upper_bound='x') }}
      - ${{ pin_compatible('libzlib', upper_bound='x') }}
      - if: unix
        then:
          - ${{ pin_compatible('ls-hpack', upper_bound='x.x.x') }}
      - ${{ pin_compatible('zstd', upper_bound='x.x') }}
      - if: not osx
        then:
          - ${{ pin_compatible('libsqlite', upper_bound='x') }}

tests:
  - package_contents:
      bin:
        - bun
        - bunx
      files:
        - if: unix
          then:
            - share/bash-completion/completions/bun
            - share/zsh/site-functions/_bun
            - share/fish/vendor_completions.d/bun.fish
      strict: true
  - script:
      - bun --version
      - bun --help
      - bunx --version
      # simple smoke test
      - bunx cowsay hello

about:
  homepage: https://bun.sh
  repository: https://github.com/oven-sh/bun
  license: MIT
  license_file:
    - LICENSE.md
    - picohttp-LICENSE-MIT
    - packages/bun-usockets/LICENSE
    - packages/bun-uws/LICENSE
    - src/clap/LICENSE
    - simdutf-LICENSE-MIT
    - simdutf-LICENSE-APACHE
    # Rust crate licenses, generated by cargo-bundle-licenses in build.sh
    - THIRDPARTY.yml
    # licenses of the statically linked vendored C/C++ dependencies,
    # collected from vendor/ in build.sh
    - vendored-licenses/
  summary: Bun is a fast all-in-one JavaScript runtime

extra:
  recipe-maintainers:
    - xhochy
    - pavelzw
    - I-Al-Istannen
